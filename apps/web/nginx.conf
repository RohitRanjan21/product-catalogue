server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Everything, product images included, comes from our own origin (DECISIONS.md A12), so the
  # browser is not allowed to reach a product source or any other host at all.
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Overwrite, don't append: the API trusts this header (TRUST_PROXY=true) for the enquiry rate
    # limit, so a client must not be able to send its own X-Forwarded-For and pick its IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  # Vite puts a content hash in asset names, so they can be cached for good.
  # (`expires` is used instead of add_header so the security headers above still apply here.)
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Client-side routes (/products/3, /search?q=...) all serve the SPA, which is never cached.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
